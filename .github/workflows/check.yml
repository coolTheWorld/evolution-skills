name: checks

# Zero-secret CI, modeled on coolTheWorld/stanford-oval-storm-skills' check.yml and
# addyosmani/agent-skills' test-plugin-install.yml: HOUSE-STYLE.md as executable
# assertions (plus a validator selftest), then a real install through both channels
# the README promises — the Claude Code plugin (`evolution@evolution-skills`, which
# is what makes every skill `/evolution:<name>`) and `npx skills add`. Nothing here
# needs an API key, so it runs on pull requests from forks too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: HOUSE-STYLE checks + validator selftest
        run: node scripts/check.js --selftest

  plugin-test:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate .
      - name: Add this repo as a local marketplace
        run: claude plugin marketplace add ./
      - name: Install the plugin from the local marketplace
        run: claude plugin install evolution@evolution-skills
      - name: Verify the plugin is installed
        run: claude plugin list | grep -i evolution

  install-test:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    env:
      NO_COLOR: 1 # runners set CI=true, which makes the skills CLI colourise "Found N skills" and break the grep below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Discover every skill
        run: |
          expected=$(find "$GITHUB_WORKSPACE/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          npx -y skills add "$GITHUB_WORKSPACE" --list </dev/null | tee discovered.txt
          grep -q "Found $expected skills" discovered.txt
      - name: Install into a fresh project
        run: |
          project=$(mktemp -d)
          cd "$project"
          npx -y skills add "$GITHUB_WORKSPACE" -a claude-code -s '*' -y </dev/null
          status=0
          for dir in "$GITHUB_WORKSPACE"/skills/*/; do
            name=$(basename "$dir")
            if [ -f ".claude/skills/$name/SKILL.md" ]; then
              echo "installed  $name"
            else
              echo "MISSING    $name"
              status=1
            fi
          done
          exit $status
